[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tradelab"
version = "0.1.0"
description = "Skeptical, systematic trading-strategy research pipeline: regime analysis, strategy library, realistic backtests, walk-forward validation and ranked reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
dev = ["pytest>=7.0"]

[project.scripts]
tradelab = "tradelab.cli:main"

[tool.setuptools.packages.find]
include = ["tradelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
